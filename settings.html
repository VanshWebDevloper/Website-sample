<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
:root{
  --bg:#020617;
  --text:#e2e8f0;
  --card:#0f172a;
  --accent:#38bdf8;
  --radius:16px;
  --font:'Inter',sans-serif;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  transition:all .3s ease;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
}
input[type="range"]{
  width:100%;
}
</style></head>
<body class="p-6"><h1 class="text-3xl font-bold mb-6">⚙️ NEXUS Settings</h1><div class="grid md:grid-cols-2 gap-6"><!-- Theme --><div class="card">
<h2 class="font-bold mb-4">Theme</h2>
<button onclick="setTheme('dark')" class="px-4 py-2 bg-black text-white rounded">Dark</button>
<button onclick="setTheme('light')" class="px-4 py-2 bg-white text-black rounded">Light</button>
</div><!-- Font Size --><div class="card">
<h2 class="font-bold mb-4">Font Size</h2>
<input type="range" min="14" max="24" value="16" oninput="setFont(this.value)">
</div><!-- Brightness --><div class="card">
<h2 class="font-bold mb-4">Brightness</h2>
<input type="range" min="0.5" max="1.5" step="0.1" value="1" oninput="setBrightness(this.value)">
</div><!-- Border Radius --><div class="card">
<h2 class="font-bold mb-4">Border Radius</h2>
<input type="range" min="0" max="40" value="16" oninput="setRadius(this.value)">
</div><!-- Accent Color --><div class="card">
<h2 class="font-bold mb-4">Accent Color</h2>
<input type="color" value="#38bdf8" onchange="setAccent(this.value)">
</div><!-- Font Style --><div class="card">
<h2 class="font-bold mb-4">Font Style</h2>
<select onchange="setFontFamily(this.value)" class="text-black p-2 rounded">
<option value="Inter">Inter</option>
<option value="monospace">Monospace</option>
<option value="serif">Serif</option>
</select>
</div><!-- Reset --><div class="card col-span-full text-center">
<button onclick="resetSettings()" class="px-6 py-3 bg-red-500 rounded text-white font-bold">Reset All</button>
</div></div><script>
function setTheme(mode){
  if(mode==='light'){
    document.documentElement.style.setProperty('--bg','#f1f5f9');
    document.documentElement.style.setProperty('--text','#020617');
    document.documentElement.style.setProperty('--card','#ffffff');
  }else{
    document.documentElement.style.setProperty('--bg','#020617');
    document.documentElement.style.setProperty('--text','#e2e8f0');
    document.documentElement.style.setProperty('--card','#0f172a');
  }
  localStorage.setItem('theme',mode);
}

function setFont(size){
  document.body.style.fontSize=size+'px';
  localStorage.setItem('fontSize',size);
}

function setBrightness(val){
  document.body.style.filter=`brightness(${val})`;
  localStorage.setItem('brightness',val);
}

function setRadius(val){
  document.documentElement.style.setProperty('--radius',val+'px');
  localStorage.setItem('radius',val);
}

function setAccent(color){
  document.documentElement.style.setProperty('--accent',color);
  localStorage.setItem('accent',color);
}

function setFontFamily(font){
  document.body.style.fontFamily=font;
  localStorage.setItem('fontFamily',font);
}

function resetSettings(){
  localStorage.clear();
  location.reload();
}

// Apply saved settings
window.onload = ()=>{
  const theme=localStorage.getItem('theme');
  if(theme) setTheme(theme);

  const fontSize=localStorage.getItem('fontSize');
  if(fontSize) document.body.style.fontSize=fontSize+'px';

  const brightness=localStorage.getItem('brightness');
  if(brightness) document.body.style.filter=`brightness(${brightness})`;

  const radius=localStorage.getItem('radius');
  if(radius) document.documentElement.style.setProperty('--radius',radius+'px');

  const accent=localStorage.getItem('accent');
  if(accent) document.documentElement.style.setProperty('--accent',accent);

  const font=localStorage.getItem('fontFamily');
  if(font) document.body.style.fontFamily=font;
}
</script></body>
</html>
